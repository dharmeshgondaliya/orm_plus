name: orm_plus
description: orm_plus is a Dart ORM for MySQL and PostgreSQL, simplifying server-side development with schema definition, CRUD operations, advanced queries, relationships, and optional logging. It streamlines server setup for scalable applications.
version: 1.0.1
repository: https://github.com/dharmeshgondaliya/orm_plus.git

platforms:
  linux:
  macos:
  windows:

environment:
  sdk: ^3.4.4

dependencies:
  archive: ^4.0.2
  mime: ^2.0.0
  mysql_client: ^0.0.27
  postgres: ^3.2.1

dev_dependencies:
  lints: ^5.1.1
  test: ^1.24.0
